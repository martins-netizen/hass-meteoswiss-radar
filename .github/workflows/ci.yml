name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: hassfest (HA manifest validation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master pinned 2026-10-19

  python:
    name: Python lint + metadata tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install verified Python tools
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r .github/requirements-ci.txt
      - name: Ruff
        run: ruff check custom_components tests scripts/generate_brands_icon.py
      - name: Pytest (fork-relevant tests)
        # This personal fork intentionally has no release workflow. Skip only
        # the upstream test that asserts release.yml and its ZIP asset wiring.
        run: pytest -q -k "not test_zip_release_asset_is_wired_end_to_end"

  frontend:
    name: Card syntax + decoder tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Vitest
        run: npm test
