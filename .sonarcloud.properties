# The fork already uses Automatic Analysis. Keep scripts and CI in scope.
sonar.sources=custom_components,scripts,.github,vitest.config.js,package.json,package-lock.json,hacs.json,pyproject.toml
sonar.tests=tests
# Exact paths work with Automatic Analysis; do not exclude first-party code.
sonar.exclusions=custom_components/meteoswiss_radar/frontend/vendor/leaflet.js,custom_components/meteoswiss_radar/frontend/vendor/leaflet.css
# Python 3.12 is the tooling minimum; retain the current HA Python versions.
sonar.python.version=3.12,3.13,3.14
